name: Somon Monitor

# ГЛАВНЫЙ процесс: собирает находки воркеров, разбирает их через Gemini, шлёт в
# Telegram и пишет итог в ветку main. Только он имеет право писать в main — воркеры
# пишут каждый в свою ветку, поэтому конфликтов push нет.
#
# Запускается:
#   1) воркером через workflow_dispatch, как только тот нашёл новый лот;
#   2) cron-job.org каждые 5 минут (страховка);
#   3) своим расписанием GitHub (вторая страховка).
# concurrency с cancel-in-progress: false — идущий разбор не обрывается, а один
# ожидающий запуск подхватит всё, что нашли за это время. Так ни одна находка не теряется.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-scraper]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: somon-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Собрать находки воркеров
        run: |
          git config user.name "somon-worker"
          git config user.email "worker@users.noreply.github.com"
          # Ветки воркеров — только чтение. Если ветки ещё нет, шаг не падает.
          git fetch --no-tags origin '+refs/heads/worker-*:refs/remotes/origin/worker-*' || true
          python merge_workers.py

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_API_KEY_2: ${{ secrets.GOOGLE_SEARCH_API_KEY_2 }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
          # Главный процесс запускается каждые 5 минут (cron-job.org) -> 12 прогонов в час.
          RUNS_PER_HOUR: "12"
          ANOMALY_REVIEW_ENABLED: "1"
          ANOMALY_REVIEW_PER_RUN: "1"
          # Разбор одного лота с Gemini долгий, поэтому бюджет времени больше, чем у воркера.
          RUN_TIME_BUDGET_SECONDS: "1500"
          INTER_ITEM_DELAY: "0.5"
          # Команды и кнопки обрабатывает постоянный слушатель bot.py — здесь опрос
          # отключён, иначе два процесса делили бы один offset Telegram.
          SKIP_TELEGRAM_POLL: "1"
        run: python scraper.py

      - name: Save results back to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          for f in seen_ids.json price_history.jsonl searches.json telegram_offset.json rejected_lots.jsonl search_mode.json subscribers.json gemini_daily_usage.json search_provider_usage.json search_daily_usage.json exchange_rate.json health_status.json min_profit.json min_confidence.json max_price.json known_anomalies.json anomaly_corrections.json anomaly_reasons.jsonl seller_blacklist.json remigrate_live_state.json imei_tac.json worker_inbox.jsonl bot_setup.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in seller_blacklist.json.corrupt-*; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "Состояние не изменилось — коммит не нужен."
          else
            git commit -m "update state"
          fi

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "Состояние сохранено (попытка $i)."
              exit 0
            fi
            echo "::warning::Попытка $i сохранить состояние не удалась — повторяю."
            git rebase --abort || true
            sleep $((i * 10))
          done
          echo "::error::Не удалось сохранить состояние после 5 попыток — изменения этого прогона могут быть потеряны."
          exit 1
