- name: Save results back to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in seen_ids.json price_history.jsonl searches.json telegram_offset.json rejected_lots.jsonl search_mode.json subscribers.json gemini_daily_usage.json search_provider_usage.json exchange_rate.json health_status.json min_profit.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase
          git push