name: Somon Monitor

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: somon-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scraper with fallback to second Gemini key
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python fallback.py

      - name: Save results back to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_ids.json price_history.jsonl searches.json telegram_offset.json rejected_lots.jsonl search_mode.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase
          git push
